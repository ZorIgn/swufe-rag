services:
  academic-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      SWUFE_ACADEMIC_DATABASE: /app/data/academic.sqlite3
      SWUFE_CORS_ALLOW_ORIGINS: ${SWUFE_CORS_ALLOW_ORIGINS:-}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    profiles: ["cpu"]
  academic-agent-gpu:
    build: .
    ports:
      - "8001:8000"
    environment:
      SWUFE_ACADEMIC_DATABASE: /app/data/academic.sqlite3
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]
