[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "swufe-rag"
version = "0.1.0"
description = "Evidence-grounded academic assistant with typed, bounded tool use."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "cryptography>=43,<51",
  "numpy>=1.26,<3",
  "rank-bm25>=0.2.2,<1",
]

[project.optional-dependencies]
retrieval = [
  "sentence-transformers>=3,<6",
  "faiss-cpu>=1.8,<2",
  "jieba>=0.42,<1",
]
ingest = ["pdfplumber>=0.11,<1", "python-docx>=1.1,<2"]
redis = ["redis>=5,<7"]
otel = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx2>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "academic", "app", "evidence", "generation", "ingest", "query", "retrieval", "storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = [
  "agent",
  "academic",
  "query",
  "evidence",
  "generation",
  "app",
  "ingest",
  "retrieval",
  "storage",
  "eval",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "artifacts", "backups", "deliveries"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
follow_imports_for_stubs = true
exclude = ["data", "artifacts", "backups", "deliveries"]

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*", "redis"]
ignore_missing_imports = true

# These optional runtime packages do not publish complete type information.
# Keep their absence/stub status from obscuring checks of our own boundaries.
[[tool.mypy.overrides]]
module = ["faiss", "rank_bm25", "sentence_transformers"]
ignore_missing_imports = true

# The lock currently resolves NumPy stubs that use Python 3.12-only syntax,
# while the runtime matrix still includes Python 3.10.  Treat NumPy as an
# external typed boundary so mypy continues to check all project modules.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
